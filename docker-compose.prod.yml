name: crm-producao

services:
  postgres:
    image: postgres:16.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
      EVOLUTION_DATABASE_NAME: ${EVOLUTION_DATABASE_NAME:?defina EVOLUTION_DATABASE_NAME no .env}
      EVOLUTION_DATABASE_USER: ${EVOLUTION_DATABASE_USER:?defina EVOLUTION_DATABASE_USER no .env}
      EVOLUTION_DATABASE_PASSWORD: ${EVOLUTION_DATABASE_PASSWORD:?defina EVOLUTION_DATABASE_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend_network]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - printf 'requirepass "%s"\nappendonly yes\n' "$$REDISCLI_AUTH" > /tmp/redis.conf && exec docker-entrypoint.sh redis-server /tmp/redis.conf
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}
    networks: [backend_network]

  evolution:
    image: atendai/evolution-api:${EVOLUTION_IMAGE_TAG:?defina EVOLUTION_IMAGE_TAG no .env}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:?defina EVOLUTION_SERVER_URL no .env}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY no .env}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${EVOLUTION_DATABASE_USER}:${EVOLUTION_DATABASE_PASSWORD}@postgres:5432/${EVOLUTION_DATABASE_NAME}?schema=public
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379/1
    volumes:
      - evolution_instances:/evolution/instances
    networks: [backend_network]

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrator
    env_file: ./backend/.env.production
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [backend_network]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    restart: unless-stopped
    env_file: ./backend/.env.production
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 15s
    networks: [backend_network, frontend_network]

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    env_file: ./backend/.env.production
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    stop_grace_period: 35s
    networks: [backend_network]

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:?defina VITE_APP_NAME no .env}
        VITE_LEAD_IMPORT_MAX_ROWS: ${VITE_LEAD_IMPORT_MAX_ROWS:?defina VITE_LEAD_IMPORT_MAX_ROWS no .env}
        VITE_LEAD_IMPORT_MAX_FILE_BYTES: ${VITE_LEAD_IMPORT_MAX_FILE_BYTES:?defina VITE_LEAD_IMPORT_MAX_FILE_BYTES no .env}
    restart: unless-stopped
    environment:
      API_UPSTREAM: ${API_UPSTREAM:?defina API_UPSTREAM no .env}
      WEB_LISTEN_PORT: ${WEB_LISTEN_PORT:?defina WEB_LISTEN_PORT no .env}
      WEB_LEAD_IMPORT_MAX_BODY_SIZE: ${WEB_LEAD_IMPORT_MAX_BODY_SIZE:?defina WEB_LEAD_IMPORT_MAX_BODY_SIZE no .env}
      WEB_HSTS_MAX_AGE: ${WEB_HSTS_MAX_AGE:?defina WEB_HSTS_MAX_AGE no .env}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:?defina WEB_PORT no .env}:${WEB_LISTEN_PORT}"
    networks: [frontend_network]

networks:
  backend_network:
  frontend_network:

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
